    <title>Oxygen Fitness Hub</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Anton&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet" />
    <style>
      :root {
        --oxy-bg: #000;
        --oxy-surface: #0a0a0a;
        --oxy-surface-2: rgba(255,255,255,0.04);
        --oxy-border: rgba(255,255,255,0.08);
        --oxy-border-strong: rgba(255,255,255,0.15);
        --oxy-red: #ef4444;
        --oxy-red-2: #b71c1c;
        --oxy-red-glow: rgba(229,57,53,0.5);
        --oxy-text: #fff;
        --oxy-text-2: rgba(255,255,255,0.72);
        --oxy-text-3: rgba(255,255,255,0.48);
        --oxy-safe-top: env(safe-area-inset-top, 0px);
        --oxy-safe-bottom: env(safe-area-inset-bottom, 0px);
        --oxy-radius-sm: 10px;
        --oxy-radius: 14px;
        --oxy-radius-lg: 20px;
      }
      *, *::before, *::after { box-sizing: border-box; }
      html, body, #root {
        margin: 0; padding: 0; height: 100%;
        background: #000;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
        text-rendering: optimizeLegibility;
        font-family: 'Plus Jakarta Sans', system-ui, sans-serif;
        color: var(--oxy-text);
        overscroll-behavior-y: none;
      }
      body {
        padding-top: var(--oxy-safe-top);
        padding-bottom: var(--oxy-safe-bottom);
        background: radial-gradient(ellipse at top, #120505 0%, #000 60%);
      }
      .oxy-display {
        font-family: 'Anton', 'Plus Jakarta Sans', sans-serif;
        letter-spacing: 0.02em;
        text-transform: uppercase;
      }
      button, a, [role="button"] {
        min-height: 44px;
        touch-action: manipulation;
        -webkit-tap-highlight-color: transparent;
      }
      button:focus-visible, a:focus-visible {
        outline: 2px solid var(--oxy-red);
        outline-offset: 2px;
      }
      input, textarea, select {
        font-family: inherit;
        font-size: 16px; /* prevents iOS zoom */
      }
      ::-webkit-scrollbar { width: 6px; height: 6px; }
      ::-webkit-scrollbar-track { background: transparent; }
      ::-webkit-scrollbar-thumb {
        background: linear-gradient(180deg, #ef4444, #7f1d1d);
        border-radius: 999px;
      }
      ::selection { background: rgba(239,68,68,0.35); color: #fff; }
      @keyframes oxy-fade-up {
        from { opacity: 0; transform: translateY(12px); }
        to { opacity: 1; transform: translateY(0); }
      }
      @keyframes oxy-pulse-red {
        0%, 100% { box-shadow: 0 0 0 0 rgba(239,68,68,0.55); }
        50% { box-shadow: 0 0 0 10px rgba(239,68,68,0); }
      }
      .oxy-hairline {
        background-image: linear-gradient(90deg, transparent, rgba(239,68,68,0.6), transparent);
        height: 1px;
      }
    </style>
